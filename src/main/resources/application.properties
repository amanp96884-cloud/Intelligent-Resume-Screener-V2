# Spring Boot Database Configuration
spring.datasource.url=jdbc:h2:file:./data/resumedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Allows you to view your database in the browser at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Automatically create tables based on our Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true